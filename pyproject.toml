[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.home_smith_buddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
